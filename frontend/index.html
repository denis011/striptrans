<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StripTrans</title>
    <script>
      // tema pre prvog crtanja (isti ključ kao src/theme.ts), da ekran ne trepne
      try {
        var theme = JSON.parse(localStorage.getItem("striptrans.theme"));
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
